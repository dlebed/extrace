<svg xmlns="http://www.w3.org/2000/svg" width="880" height="268" viewBox="0 0 880 268" role="img" aria-label="extrace: tracing for heterogeneous multi-core SoCs">
<title>extrace: tracing for heterogeneous multi-core SoCs</title>
<rect x="0.5" y="0.5" width="879" height="267" rx="12" fill="#fcfcfb" stroke="#e2e0d9"/>
<g transform="translate(26 20) scale(1.25)" fill="none" stroke-linecap="round" stroke-width="8" stroke-dasharray="5.78 132.45">
  <circle cx="32" cy="32" r="22" stroke="#2a78d6" transform="rotate(-75 32 32)"/>
  <circle cx="32" cy="32" r="22" stroke="#2a78d6" transform="rotate(-30 32 32)"/>
  <circle cx="32" cy="32" r="22" stroke="#2a78d6" transform="rotate(15 32 32)"/>
  <circle cx="32" cy="32" r="22" stroke="#2a78d6" transform="rotate(60 32 32)"/>
  <circle cx="32" cy="32" r="22" stroke="#eb6834" transform="rotate(105 32 32)"/>
  <circle cx="32" cy="32" r="22" stroke="#dedcd4" transform="rotate(150 32 32)"/>
  <circle cx="32" cy="32" r="22" stroke="#dedcd4" transform="rotate(195 32 32)"/>
  <circle cx="32" cy="32" r="22" stroke="#dedcd4" transform="rotate(240 32 32)"/>
</g>
<text x="114" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-3.24" fill="#0b0b0b"><tspan fill="#2a78d6">ex</tspan>trace</text>
<text x="34" y="120" fill="#52514e" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Tracing for heterogeneous multi-core SoCs, where every core runs its own</text>
<text x="34" y="142" fill="#52514e" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">firmware and the shared memory is not cache-coherent. Each core writes</text>
<text x="34" y="164" fill="#52514e" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">compact records into its own lock-free ring; one dispatcher reads them all.</text>
<rect x="34.0" y="196" width="136.8" height="26" rx="13" fill="#efeee9" stroke="#e2e0d9"/>
<text x="102.4" y="213.5" fill="#52514e" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle">2–8 byte records</text>
<rect x="178.8" y="196" width="180.6" height="26" rx="13" fill="#efeee9" stroke="#e2e0d9"/>
<text x="269.1" y="213.5" fill="#52514e" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle">no locks between cores</text>
<rect x="367.4" y="196" width="217.1" height="26" rx="13" fill="#efeee9" stroke="#e2e0d9"/>
<text x="475.9" y="213.5" fill="#52514e" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle">per-function ftrace flavors</text>
<rect x="592.5" y="196" width="136.8" height="26" rx="13" fill="#efeee9" stroke="#e2e0d9"/>
<text x="660.9" y="213.5" fill="#52514e" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle">caller recording</text>
<rect x="34.0" y="230" width="122.2" height="26" rx="13" fill="#efeee9" stroke="#e2e0d9"/>
<text x="95.1" y="247.5" fill="#52514e" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle">ARMv7-M · RV32</text>
<rect x="164.2" y="230" width="136.8" height="26" rx="13" fill="#efeee9" stroke="#e2e0d9"/>
<text x="232.6" y="247.5" fill="#52514e" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="middle">freestanding C23</text>
</svg>
